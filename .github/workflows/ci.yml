name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '20'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Run linting
        run: |
          pip install ruff
          ruff check src/

      - name: Run type checking
        run: |
          pip install mypy
          mypy src/

      - name: Run tests
        run: |
          pip install pytest pytest-cov
          pytest tests/ -v --cov=src/brain --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: ./vscode-extension
        run: npm ci

      - name: Compile TypeScript
        working-directory: ./vscode-extension
        run: npm run compile

      - name: Run linting
        working-directory: ./vscode-extension
        run: npm run lint

      - name: Package extension
        working-directory: ./vscode-extension
        run: npx vsce package --no-dependencies

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-brain-vsix
          path: vscode-extension/*.vsix

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, vscode-extension]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build wheel
        run: |
          pip install build
          python -m build

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, vscode-extension, build]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/wheel/*.whl
            artifacts/project-brain-vsix/*.vsix
          draft: false
          prerelease: false